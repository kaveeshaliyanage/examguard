spring:
  datasource:
    url: jdbc:h2:mem:examguard;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false

app:
  jwt:
    # Test-only secret. Never reuse this value outside tests.
    secret: test-only-secret-0123456789abcdef-0123456789
    staff-ttl-minutes: 60
    attempt-ttl-minutes: 60
  analysis:
    base-url: http://localhost:9
    connect-timeout-ms: 100
    read-timeout-ms: 100
  cors:
    allowed-origins: http://localhost:5173
  seed-demo-data: false

logging:
  level:
    com.examguard: WARN
    org.hibernate.SQL: WARN
