spring:
  datasource:
    url: ${TEST_PG_URL}
    username: ${TEST_PG_USER:examguard}
    password: ${TEST_PG_PASSWORD:examguard}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration/common,classpath:db/migration/postgresql

app:
  db:
    vendor: postgresql
  analysis:
    base-url: http://localhost:9
    connect-timeout-ms: 100
    read-timeout-ms: 100
  cors:
    allowed-origins: http://localhost:5173
  seed-demo-data: false

logging:
  level:
    com.examguard: WARN
    org.hibernate.SQL: WARN
