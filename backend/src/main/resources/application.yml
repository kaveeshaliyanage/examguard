server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: examguard-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/examguard?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:examguard}
    password: ${SPRING_DATASOURCE_PASSWORD:examguard}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: true
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    staff-ttl-minutes: ${JWT_STAFF_TTL_MINUTES:480}
    attempt-ttl-minutes: ${JWT_ATTEMPT_TTL_MINUTES:360}
  analysis:
    base-url: ${ANALYSIS_BASE_URL:http://localhost:8000}
    connect-timeout-ms: 5000
    read-timeout-ms: 120000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  seed-demo-data: ${SEED_DEMO_DATA:true}

logging:
  level:
    com.examguard: INFO
    org.hibernate.SQL: WARN
