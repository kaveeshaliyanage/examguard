version: 1
repowiki:
  notes:
    - text: "priorityScore is 0-100 review priority, never a probability of misconduct. Bands: LOW 0-29, MEDIUM 30-54, HIGH 55-74, CRITICAL 75-100."
    - text: "Isolation rule: the pair analysis payload never contains activity events, and an incident payload contains exactly one candidate. Preserve this when documenting or changing analysis code."
    - text: "Score caps applied after any learned-model override: pair incomplete 35, incident low coverage 45, unclassified-only 40, authorship 54."
    - text: "Stack: Java 21 / Spring Boot 3.4 / JPA / Flyway / MySQL 8.4 (Postgres 16 in cloud); FastAPI + scikit-learn; React 18 + TypeScript strict + Vite 5 + MUI 5 + TanStack Query; Chrome MV3 extension."
    - text: "Feature order is a contract: PAIR_FEATURE_ORDER = lexical, semantic, rare, cross, timing, coverageWarning; INCIDENT_FEATURE_ORDER = prohibited, correlated, repeat, unclassified, coverage, extensionConnected. Changing it invalidates trained artifacts."
    - text: "Flyway DDL is per-vendor under db/migration/mysql and db/migration/postgresql; db/migration/common holds portable data-only migrations."
    - text: "The Chrome extension cannot block tabs or detect other applications. Focus-loss strikes are recorded signals, not enforcement; describe them that way."
    - text: "Exam schedule blocks new joins outside opens_at/closes_at; in-progress attempts may resume. A non-empty roster restricts joins to enrolled accounts; guests are rejected."
  documents:
    - title: "ExamGuard overview"
      goal: "What the system does, the two review outputs (pair similarity and candidate incident), the score semantics, and the isolation rule."
      hints: "Start from README.md and docs/HANDOFF.md; include the architecture diagram and the repository map."
    - title: "Exam engine and attempts"
      goal: "Exam lifecycle, typed questions, attempt state machine, strike policy, autosave, and student accounts."
      hints: "backend/src/main/java/com/examguard/exam, attempt, domain; frontend/src/features/student."
    - title: "Grading and results"
      goal: "Auto-grading rules per question type, manual grading queue, and the result-release gate."
      hints: "AutoGradingService, GradeService, answer_grade table, release endpoints."
    - title: "Integrity detection"
      goal: "How pair similarity, activity incidents, and the authorship classifier combine into priority scores, including caps and their limits."
      hints: "ai/app analysis and fusion modules, analysis client, evidence_item, model caps."
    - title: "Reports and PDF export"
      goal: "Student, lecturer, and admin report content, PDF rendering pipeline, fonts, and CSV export."
      hints: "ReportService, templates/reports, openhtmltopdf configuration."
    - title: "Staff dashboards and UI system"
      goal: "Frontend shell, design tokens, data tables, charts, authoring UI, and grading UI."
      hints: "frontend/src/design, frontend/src/components, features/exams, features/findings, frontend/src/test/a11y.test.tsx, dashboard endpoints, and the roster (GET/POST/DELETE /api/exams/{id}/roster) and settings (PATCH /api/exams/{id}) endpoints."
    - title: "Browser extension"
      goal: "What the MV3 extension observes, its permissions, heartbeat, and explicit limitations."
      hints: "extension/src, manifest.json, collector token flow."
    - title: "AI service"
      goal: "FastAPI endpoints, request schemas, rules vs learned fusion, and model loading with version-skew warnings."
      hints: "ai/app/main.py, schemas.py, features, analysis modules."
    - title: "Training and model artifacts"
      goal: "Synthetic and external corpora, export/train pipeline, leakage-safe cohort splits, Kaggle publishing, and model cards."
      hints: "ai/app/training, kaggle/, docs/TRAINING.md."
    - title: "Deployment and operations"
      goal: "Local compose, GHCR image release, VPS deployment, and the Render/Supabase/Vercel cloud topology."
      hints: "docs/DEPLOYMENT.md, .github/workflows, render.yaml, vercel.json, scripts/deploy.sh."
    - title: "Testing and verification"
      goal: "Test layers per module, Postgres validation profile, Playwright flows, AI evaluation gates, and the compose smoke job."
      hints: ".github/workflows/ci.yml, backend/src/test, ai/tests, frontend tests, frontend/src/test/a11y.test.tsx (axe suite over the main pages and dialogs), extension tests."
knowledgecard:
  notes:
    - text: "Treat priorityScore as review priority, never as a probability of cheating; keep this framing in every module description."
    - text: "The pair/incident payload isolation rule is a hard architectural constraint, not a convention."
    - text: "Learned fusion artifacts are optional: without ai/models artifacts the rule weights are used, so never document learned scoring as always-on."
    - text: "Exam schedule blocks new joins outside opens_at/closes_at; in-progress attempts may resume. A non-empty roster restricts joins to enrolled accounts; guests are rejected."
