name: examguard

# Production stack: prebuilt GHCR images, no build contexts, no published database or AI ports.
# Only the frontend is exposed; its nginx proxies /api/ to the backend.

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-examguard}
      MYSQL_USER: ${MYSQL_USER:-examguard}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - examguard_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  ai:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER in .env}/examguard-ai:${EXAMGUARD_VERSION:-latest}
    restart: unless-stopped
    volumes:
      - ./ai/models:/app/models:ro
    environment:
      SEMANTIC_ENABLED: ${SEMANTIC_ENABLED:-false}
      SEMANTIC_MODEL: ${SEMANTIC_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      USE_LEARNED_FUSION: ${USE_LEARNED_FUSION:-false}
      MODEL_DIR: /app/models
      MIN_PAIR_PRIORITY: ${MIN_PAIR_PRIORITY:-20}
      MIN_INCIDENT_PRIORITY: ${MIN_INCIDENT_PRIORITY:-10}
      # Optional here (the service is not published); set it on both sides for defence in depth.
      ANALYSIS_TOKEN: ${ANALYSIS_TOKEN:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  runner:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER in .env}/examguard-runner:${EXAMGUARD_VERSION:-latest}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=128m
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN:?set RUNNER_TOKEN in .env}
      MAX_CONCURRENCY: ${RUNNER_MAX_CONCURRENCY:-2}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    pids_limit: 256
    networks:
      - runner_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER in .env}/examguard-backend:${EXAMGUARD_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      ai:
        condition: service_healthy
      runner:
        condition: service_healthy
    networks:
      - default
      - runner_net
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-examguard}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-examguard}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to at least 32 characters in .env}
      JWT_STAFF_TTL_MINUTES: ${JWT_STAFF_TTL_MINUTES:-480}
      JWT_ATTEMPT_TTL_MINUTES: ${JWT_ATTEMPT_TTL_MINUTES:-360}
      ANALYSIS_BASE_URL: http://ai:8000
      ANALYSIS_TOKEN: ${ANALYSIS_TOKEN:-}
      CODE_RUNNER_BASE_URL: http://runner:8000
      RUNNER_TOKEN: ${RUNNER_TOKEN:?set RUNNER_TOKEN in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS in .env}
      # First administrator on an empty database; ignored once any ADMIN exists.
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrator}
      # Exam PIN email is opt-in: point MAIL_* at your SMTP relay and set MAIL_ENABLED=true.
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-25}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@examguard.local}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      SERVER_PORT: 8080
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  frontend:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER in .env}/examguard-frontend:${EXAMGUARD_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  examguard_mysql:

networks:
  runner_net:
    internal: true
