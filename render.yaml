# Render Blueprint for the ExamGuard cloud deployment (free plan).
# Deploy from the repo root: New > Blueprint > select this repository.
# Values marked `sync: false` are prompted for on the first Blueprint sync; docs/DEPLOYMENT.md
# ("Cloud deployment") lists what goes in each one.
#
# Free-plan limits that shape this file:
# - Instances sleep after 15 idle minutes and take 30-60 s to wake. An attempt that passes its
#   deadline while the API sleeps is auto-submitted a few seconds after it wakes, stamped with
#   the deadline itself.
# - Free services cannot be private, so the analysis service is public and every analysis call
#   carries the shared ANALYSIS_TOKEN generated below.
# - The code runner is not deployed: coding answers stay ungraded (never scored zero) until a
#   runner is added on a paid private service.

envVarGroups:
  - name: examguard-shared
    envVars:
      # Shared by the API and the analysis service; generated once by Render.
      - key: ANALYSIS_TOKEN
        generateValue: true

services:
  - type: web
    name: examguard-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    # Redeploy only after GitHub CI passes on main, and only when backend code changed.
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - backend/**
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: examguard-shared
      - key: PORT
        value: "8080"
      - key: DB_VENDOR
        value: postgresql
      # Supabase session pooler, e.g.
      # jdbc:postgresql://aws-0-eu-central-1.pooler.supabase.com:5432/postgres?sslmode=require&currentSchema=examguard
      - key: SPRING_DATASOURCE_URL
        sync: false
      # Pooler user name: examguard.<project-ref>
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # Few connections: one instance, and Supabase's pooler caps connections per user.
      - key: DB_POOL_SIZE
        value: "5"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_STAFF_TTL_MINUTES
        value: "480"
      - key: JWT_ATTEMPT_TTL_MINUTES
        value: "360"
      # Public URL of examguard-ai, e.g. https://examguard-ai.onrender.com (no trailing slash).
      - key: ANALYSIS_BASE_URL
        sync: false
      # Exact Vercel production origin, e.g. https://examguard.vercel.app. No wildcards.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # First administrator on the empty database. Remove both once you have signed in.
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      # Exam PIN email. Keep MAIL_ENABLED=false until an SMTP relay is configured; the PIN is
      # still shown once to the lecturer.
      - key: MAIL_ENABLED
        value: "false"
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_SMTP_AUTH
        value: "true"
      - key: MAIL_STARTTLS
        value: "true"
      - key: MAIL_FROM
        sync: false
      - key: SEED_DEMO_DATA
        value: "false"
      # Fits the JVM into the free plan's 512 MB.
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=60 -XX:+UseSerialGC -Xss512k -XX:ReservedCodeCacheSize=48m -XX:MaxMetaspaceSize=160m"
      - key: SERVER_TOMCAT_THREADS_MAX
        value: "40"

  - type: web
    name: examguard-ai
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    buildFilter:
      paths:
        - ai/**
    dockerfilePath: ./ai/Dockerfile
    dockerContext: ./ai
    healthCheckPath: /health
    envVars:
      - fromGroup: examguard-shared
      - key: PORT
        value: "8000"
      - key: MODEL_DIR
        value: /app/models
      - key: USE_LEARNED_FUSION
        value: "false"
      - key: SEMANTIC_ENABLED
        value: "false"
