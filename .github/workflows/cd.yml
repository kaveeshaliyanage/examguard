name: CD

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the published images to the VPS
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  checks: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: examguard

jobs:
  verify:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for a green CI run on the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ci_jobs='["backend","backend-postgres","ai","ai-eval","runner","frontend","extension","compose"]'
          deadline=$((SECONDS + 1500))
          while :; do
            check_runs=$(gh api \
              "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs?per_page=100")
            completed=$(jq --argjson names "$ci_jobs" \
              '[.check_runs[] | select(.name as $n | $names | index($n)) | select(.status == "completed")] | length' \
              <<<"$check_runs")
            failed=$(jq --argjson names "$ci_jobs" \
              '[.check_runs[] | select(.name as $n | $names | index($n)) | select(.status == "completed" and .conclusion != "success")] | length' \
              <<<"$check_runs")
            if [ "$failed" -gt 0 ]; then
              echo "CI failed on ${{ github.sha }}; refusing to publish." >&2
              exit 1
            fi
            if [ "$completed" -ge 8 ]; then
              echo "All ${completed} CI jobs succeeded on ${{ github.sha }}."
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "CI did not finish within 25 minutes (${completed} of 8 jobs)." >&2
              exit 1
            fi
            sleep 30
          done

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        component: [backend, ai, frontend, runner]
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase the repository owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_PREFIX }}-${{ matrix.component }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Build the extension
        working-directory: extension
        run: |
          npm ci
          npm run build

      - name: Package the extension
        working-directory: extension
        run: |
          cd dist
          zip -r ../examguard-extension-${{ github.ref_name }}.zip .

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: extension/examguard-extension-${{ github.ref_name }}.zip
          body: |
            Images (GHCR):
            - `ghcr.io/${{ github.repository_owner }}/examguard-backend:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/examguard-ai:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/examguard-frontend:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/examguard-runner:${{ github.ref_name }}`

            Deploy with `scripts/deploy.sh ${{ github.ref_name }}` on the VPS, or run the
            CD workflow manually with `deploy` enabled.

  deploy:
    needs: publish
    if: >-
      startsWith(github.ref, 'refs/tags/') && (
        vars.DEPLOY_ENABLED == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Pull images and restart the stack
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd '${{ vars.VPS_APP_DIR }}' && ./scripts/deploy.sh '$VERSION'"
