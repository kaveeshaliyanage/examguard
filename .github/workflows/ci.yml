name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test
        working-directory: backend
        run: mvn -B test

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: examguard
          POSTGRES_USER: examguard
          POSTGRES_PASSWORD: examguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test against PostgreSQL
        working-directory: backend
        env:
          TEST_PG_URL: jdbc:postgresql://localhost:5432/examguard
          TEST_PG_USER: examguard
          TEST_PG_PASSWORD: examguard
        run: mvn -B test

  ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai/requirements-dev.txt
      - name: Install
        working-directory: ai
        run: pip install -r requirements-dev.txt
      - name: Test
        working-directory: ai
        run: pytest -q

  ai-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai/requirements-dev.txt
      - name: Install
        working-directory: ai
        run: pip install -r requirements-dev.txt
      - name: Export synthetic authorship rows
        working-directory: ai
        run: python -m app.training.authorship_export --out data-authorship --cohorts 200 --seed 7
      - name: Train authorship classifier
        working-directory: ai
        run: python -m app.training.authorship_train --data data-authorship --out models --seed 7
      - name: Gate on AUROC, TPR@5%FPR and calibration
        working-directory: ai
        run: >-
          python -m app.training.authorship_eval
          --data data-authorship/authorship.jsonl
          --model models/authorship.joblib
          --report authorship-eval.json
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authorship-eval-report
          path: ai/authorship-eval.json
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run budget
        working-directory: frontend

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
        working-directory: extension
      - run: npm run typecheck
        working-directory: extension
      - run: npm test
        working-directory: extension
      - run: npm run build
        working-directory: extension
      - name: Upload unpacked extension
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: extension/dist

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare environment
        run: |
          cp .env.example .env
          printf 'JWT_SECRET=%s\n' "$(openssl rand -hex 32)" >> .env
      - name: Build images
        run: docker compose build
      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 420
      - name: Smoke test the running stack
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8080/api/health
          curl -fsS http://localhost:5173/ > /dev/null
          TOKEN=$(curl -fsS -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"lecturer@examguard.local","password":"Lecturer123!"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          curl -fsS -H "Authorization: Bearer $TOKEN" http://localhost:8080/api/exams > /dev/null
      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: End-to-end exam flow
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v
